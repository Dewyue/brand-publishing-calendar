<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>品牌发布日历</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="./" class="identity"><span class="app-icon">▦</span>品牌发布日历</a><span id="saveState">● 已保存在此浏览器</span></header><main>
<section class="intro"><div><div class="eyebrow">CONTENT CALENDAR</div><h1>今天的发布，一目了然。</h1><p>每周一、三、五 · 三个品牌 · 小红书与公众号</p></div><span class="local-tag">发布提醒与记录</span></section>
<section class="today-panel"><div class="today-heading"><div><h2>今日待办 <span id="todayDate"></span></h2><p id="todayProgress"></p></div><span class="today-tag">TODAY</span></div><div id="todayTasks" class="today-platforms"></div></section>
<section class="workspace"><div class="toolbar"><div class="month-nav"><h2 id="monthTitle"></h2><button id="prev" aria-label="上个月">‹</button><button id="next" aria-label="下个月">›</button><button id="today">回到今天</button></div><div id="brands" class="brand-filters"><button data-brand="all" class="active">全部品牌</button><button data-brand="onion"><i class="dot onion"></i>洋葱</button><button data-brand="bafen"><i class="dot bafen"></i>八分</button><button data-brand="lingzhi"><i class="dot lingzhi"></i>灵知</button></div></div>
<div class="calendar-scroll"><div class="calendar-inner"><div class="weekdays"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div><div id="calendar" class="calendar"></div></div></div><div class="calendar-footer"><span id="count"></span><span>点击品牌格填写文件名 · 勾选记录已发布</span></div></section>
<footer><span><i class="dot onion"></i>洋葱雅思 <i class="dot bafen"></i>八分雅思 <i class="dot lingzhi"></i>灵知雅思</span><div><button id="import">导入备份</button><button id="export">导出备份 ↗</button></div></footer><p class="privacy">数据保存在当前浏览器 · 不会自动向平台发布</p></main>
<dialog id="editor"><form id="form"><div class="dialog-heading"><h2 id="editorTitle">填写发布内容</h2><button type="button" id="close" aria-label="关闭">×</button></div><p id="context"></p><div class="brand-picker" id="brandPicker"></div><label for="description">内容 / 文件名称</label><input id="description" maxlength="300" autocomplete="off" placeholder="填写一行文件名称或内容描述"><div class="dialog-actions"><button type="button" id="clear" class="muted">清空记录</button><div><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存</button></div></div></form></dialog><input id="importFile" type="file" accept="application/json,.json" hidden><div id="toast" class="toast" role="status"></div><script src="app.js"></script></body></html>
